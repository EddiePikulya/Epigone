services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: epigone
      POSTGRES_PASSWORD: epigone
      POSTGRES_DB: epigone
    ports:
      # Bind Postgres to loopback only: reachable locally (tests, psql) but never
      # from the public internet on a deployed server. Services reach it over the
      # compose network by hostname, not this mapping.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epigone"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    command: ["/app/.venv/bin/python", "-m", "epigone.bot.main"]
    environment:
      DATABASE_URL: postgresql://epigone:epigone@postgres:5432/epigone
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    build: .
    command: ["/app/.venv/bin/python", "-m", "epigone.ingest.main"]
    environment:
      DATABASE_URL: postgresql://epigone:epigone@postgres:5432/epigone
      # Coarse Universe re-seed cadence (issue #50); unset → 60-min default.
      SEED_INTERVAL_MINUTES: ${SEED_INTERVAL_MINUTES:-60}
      # Fine-pass chunk per cycle (issue #66); unset → 500 default.
      FINE_CHUNK_SIZE: ${FINE_CHUNK_SIZE:-500}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  stream:
    build: .
    command: ["/app/.venv/bin/python", "-m", "epigone.stream.main"]
    environment:
      DATABASE_URL: postgresql://epigone:epigone@postgres:5432/epigone
      # The cutover's kill switch (issue #158, ADR-0009). Unset means the
      # websocket owns position-event production and this process runs as a
      # warm standby: still reading every wallet, still reconciling, taking
      # production back on its own when the lane goes bad. Set to 0/false to
      # pin production here at the 10s cadence — the pre-cutover world — with
      # no redeploy of anything else and no probation on the way in.
      WS_AUTHORITATIVE: ${WS_AUTHORITATIVE:-1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The websocket lane (issues #157, #168, #158). Since the cutover it is the
  # PRODUCER of position events — Position Alerts and copy execution act on its
  # rows — while `stream` keeps polling as a warm standby that reconciles
  # against it and takes production back automatically if it goes bad.
  #
  # Its own service rather than a third loop inside `stream`, and that is the
  # safety argument rather than packaging: sharing a process would give either
  # lane a path to kill the other. Here it can crash, wedge, or be stopped
  # (`docker compose stop ws`) and event production simply moves back to the
  # poller within ~a minute (ADR-0009). Stopping it is a supported operation,
  # not an outage.
  ws:
    build: .
    command: ["/app/.venv/bin/python", "-m", "epigone.ws.main"]
    environment:
      DATABASE_URL: postgresql://epigone:epigone@postgres:5432/epigone
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Proactive health-check (issue #52): evaluates liveness/freshness signals on a
  # short cadence and DMs the admin on Telegram — problem alerts, recoveries, and
  # a daily "all good" heartbeat. Send-only (no polling), so it shares the bot
  # token with `bot` without the two-poller conflict. All HEALTHCHECK_* knobs are
  # optional and default safely (see epigone.monitor.config).
  monitor:
    build: .
    command: ["/app/.venv/bin/python", "-m", "epigone.monitor.main"]
    environment:
      DATABASE_URL: postgresql://epigone:epigone@postgres:5432/epigone
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      # Sets the default coarse-staleness window (2× this); matches ingest's cadence.
      SEED_INTERVAL_MINUTES: ${SEED_INTERVAL_MINUTES:-60}
      # The disk-headroom check reads the host root mounted read-only below.
      HEALTHCHECK_DISK_PATH: /host
    volumes:
      # Host filesystem, read-only: gives the disk check real server headroom
      # (backups + fine_trades growth), not the container image's view.
      - /:/host:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The A3 safety layer's PRIMARY dead-man's switch (issue #135): cancel-alls
  # and halts when the executor's heartbeat goes stale, sweeps /kill halts,
  # and maintains the scheduleCancel upgrade path (volume-gated, PR #141).
  # Behind the `execution` profile: it fail-fasts without a watchdog-lane
  # agent key (`python -m epigone.keystore generate --lane watchdog …`, then
  # the approval ceremony), so it only joins `docker compose up` once the
  # operator opts in with --profile execution after the ceremony. Testnet by
  # default: WATCHDOG_EXCHANGE_URL defaults to testnet, and a mainnet URL is
  # refused in code unless EXECUTOR_ALLOW_MAINNET is set — the EXECUTOR's own
  # flag, deliberately, because the sweep must reach whatever book the
  # executor can trade on (#137).
  watchdog:
    build: .
    profiles: ["execution"]
    command: ["/app/.venv/bin/python", "-m", "epigone.safety.main"]
    environment:
      DATABASE_URL: postgresql://epigone:epigone@postgres:5432/epigone
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      KEYSTORE_KEK_FILE: /run/secrets/keystore-kek
      # The cold-start key cache (issue #145). MUST live on the persistent
      # volume below: its whole job is surviving a restart taken during a
      # Postgres outage, which a container-local path would not.
      WATCHDOG_KEY_CACHE_FILE: /var/lib/epigone/watchdog-key-cache.enc
      # Unset = testnet. Set it (with the mainnet URLs) to go live, and set it
      # for BOTH services or neither.
      EXECUTOR_ALLOW_MAINNET: ${EXECUTOR_ALLOW_MAINNET:-}
      WATCHDOG_EXCHANGE_URL: ${WATCHDOG_EXCHANGE_URL:-}
      # The OUT-OF-BAND page path (issue #213), and a mainnet gate. Every
      # other alarm runs through Epigone — the #52 monitor reads Postgres on
      # this host and DMs from the container beside this one — so losing the
      # host loses the alarm too. Set this to an external dead-man check's
      # ping URL (healthchecks.io-style) and that service pages the operator
      # from its own infrastructure when the pings stop. A SECRET: the path
      # is the credential. Unset is supported and the watchdog says so loudly
      # at startup; see docs/runbooks/halt-and-unwind.md for setup and for
      # what it does and does not cover.
      WATCHDOG_DEADMAN_PING_URL: ${WATCHDOG_DEADMAN_PING_URL:-}
      WATCHDOG_DEADMAN_PING_SECONDS: ${WATCHDOG_DEADMAN_PING_SECONDS:-60}
    volumes:
      # The KEK file (outside git, outside the DB — keystore invariant),
      # mounted read-only where KEYSTORE_KEK_FILE points.
      - ${KEYSTORE_KEK_FILE:-./.keystore-kek}:/run/secrets/keystore-kek:ro
      - watchdog-state:/var/lib/epigone
    # NO depends_on (issue #145): `condition: service_healthy` would refuse to
    # start the watchdog for exactly as long as Postgres is unhealthy — the
    # one window where a cold-started watchdog is the only cancel path there
    # is. It starts regardless and decides for itself (epigone.safety.coldstart).
    restart: unless-stopped

  # The A4 operator copy executor (issue #136, ADR-0007): mirrors copy-enabled
  # Leaders into their own funded sub-accounts, reconciles against the exchange
  # every loop, and reports every action and every skip to the operator's chat.
  #
  # Behind the same `execution` profile as the watchdog, and for the same
  # reason: it fail-fasts without an EXECUTOR-lane agent key (`python -m
  # epigone.keystore generate --lane executor …`, then the approval ceremony).
  # It also expects the watchdog to be running — the executor beats the
  # heartbeat that the dead-man's switch reads, and an executor with nothing
  # watching it is the configuration A3 exists to prevent.
  #
  # TESTNET BY DEFAULT (#137 §8). Going live takes both EXECUTOR_ALLOW_MAINNET
  # and a mainnet EXECUTOR_EXCHANGE_URL — either alone still trades testnet, so
  # a half-edited env file cannot go live by accident. Set the flag for the
  # watchdog too (it reads the same variable); the docs/runbooks/copy-execution
  # runbook has the three-part checklist.
  #
  # UNLIKE the watchdog, this one DOES depend on Postgres being healthy. The
  # asymmetry is deliberate: a blind watchdog must still cancel (subtractive,
  # and the outage is exactly when orders go unattended), while a blind
  # executor must not trade — it would have no halt state, no mappings, no
  # claims, and no way to write the audit row that must precede the wire.
  execute:
    build: .
    profiles: ["execution"]
    command: ["/app/.venv/bin/python", "-m", "epigone.execute.main"]
    environment:
      DATABASE_URL: postgresql://epigone:epigone@postgres:5432/epigone
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      KEYSTORE_KEK_FILE: /run/secrets/keystore-kek
      EXECUTOR_INTERVAL_SECONDS: ${EXECUTOR_INTERVAL_SECONDS:-5}
      EXECUTOR_ALLOW_MAINNET: ${EXECUTOR_ALLOW_MAINNET:-}
      EXECUTOR_EXCHANGE_URL: ${EXECUTOR_EXCHANGE_URL:-}
      # The SIGNAL network's read-only info endpoint (#184, amendment D-6):
      # where the Leader's liveness equity is read, defaulting to MAINNET
      # because that is where tracking observed them. Unset is correct for
      # both the shakedown and a live mainnet deployment; it holds no key and
      # can place nothing.
      EXECUTOR_SIGNAL_INFO_URL: ${EXECUTOR_SIGNAL_INFO_URL:-}
    volumes:
      - ${KEYSTORE_KEK_FILE:-./.keystore-kek}:/run/secrets/keystore-kek:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  # The watchdog's encrypted cold-start key cache. Sealed under the KEK, so
  # this volume alone yields nothing — same property a database dump has.
  watchdog-state:
