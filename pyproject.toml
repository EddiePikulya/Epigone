[project]
name = "epigone"
version = "0.1.0"
description = "Telegram bot that finds and tracks the best Hyperliquid perp traders — by your own criteria"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "aiohttp>=3.9",
    # Pinned to the verified minor (PR #143 rounds 4-5): the safety pool's
    # acquire/release-budget seam and the untimed-cancel_waiter workaround
    # were verified against 0.31's internals, and drift there degrades
    # SILENTLY — an asyncpg upgrade must be a deliberate visit to
    # epigone/safety/db.py and its black-hole tests, never an accident.
    "asyncpg>=0.31,<0.32",
    "cryptography>=49.0.0",
    "eth-account>=0.13.7",
    "hyperliquid-python-sdk>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
    "mypy>=1.14",
    "ruff>=0.9",
    "hyperliquid-python-sdk>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epigone"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A reverted safety fix must FAIL CI, not hang it (PR #143 round 5): the
# black-hole regression tests would otherwise wait on asyncpg's untimed
# cancel path until the CI job timeout. Generous against the slowest real
# test (~30s of genuine timeout exercise); anything past it is a hang.
timeout = 120

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["epigone"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hyperliquid.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The deploy runs this one under the *host's* python3 (issue #160), not ours, so
# it stays inside 3.9-era syntax: `timezone.utc` rather than 3.11's `datetime.UTC`.
"src/epigone/dump_retention.py" = ["UP017"]
# aiogram's BaseSession interface mandates `timeout` parameters.
"tests/support/telegram.py" = ["ASYNC109"]
"tests/test_alert_delivery.py" = ["ASYNC109"]
"tests/test_delete_button.py" = ["ASYNC109"]
